<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StepWorld — 여권별 비자·워홀·안전·가이드·채용</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-muted: #f1f5f9;
      --ink: #0f172a;
      --ink-muted: #475569;
      --ink-soft: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --ok-bg: #ecfdf5;
      --ok-text: #047857;
      --ok-border: #a7f3d0;
      --warn-bg: #fffbeb;
      --warn-text: #b45309;
      --warn-border: #fde68a;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
    }

    button, input, select {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill-group {
      display: inline-flex;
      background: var(--surface-muted);
      padding: 4px;
      border-radius: 12px;
      gap: 2px;
    }

    .pill-btn {
      border: 0;
      background: transparent;
      padding: 6px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .pill-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    .age-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 13px;
    }

    .age-box input {
      width: 68px;
      border: 0;
      background: transparent;
      font-weight: 700;
      text-align: right;
      outline: none;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px 20px 64px;
      display: grid;
      gap: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 22px;
    }

    .hero h1 {
      margin: 8px 0 6px;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero p {
      margin: 0;
      color: var(--ink-muted);
      font-size: 14px;
    }

    .eyebrow {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .filter-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-input {
      flex: 1 1 240px;
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 14px;
    }

    .tab-btn {
      height: 42px;
      padding: 0 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink-muted);
    }

    .tab-btn.active {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .country-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .country-card:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .country-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .country-code {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .country-name {
      margin: 0;
      font-size: 17px;
      font-weight: 800;
    }

    .country-sub {
      font-size: 12px;
      color: var(--ink-soft);
    }

    .badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
    }

    .badge-ok {
      background: var(--ok-bg);
      color: var(--ok-text);
      border-color: var(--ok-border);
    }

    .badge-warn {
      background: var(--warn-bg);
      color: var(--warn-text);
      border-color: var(--warn-border);
    }

    .badge-neutral {
      background: var(--surface-muted);
      color: var(--ink-muted);
      border-color: var(--border);
    }

    .meta-list {
      display: grid;
      gap: 6px;
      font-size: 13px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 10px;
      background: var(--bg);
    }

    .meta-label { color: var(--ink-soft); }
    .meta-val { font-weight: 700; text-align: right; }

    .btn-primary {
      width: 100%;
      height: 38px;
      border: 0;
      border-radius: 11px;
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
    }

    .btn-primary:hover { background: var(--primary-hover); }

    .jobs-list {
      display: grid;
      gap: 10px;
    }

    .job-item {
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .job-title {
      margin: 2px 0;
      font-size: 15px;
      font-weight: 800;
    }

    .job-meta {
      font-size: 12px;
      color: var(--ink-muted);
    }

    .apply-btn {
      height: 36px;
      padding: 0 14px;
      border-radius: 10px;
      border: 0;
      background: var(--ink);
      color: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .apply-btn.applied {
      background: var(--ok-text);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.45);
      display: none;
      justify-content: flex-end;
    }

    .drawer-backdrop.open { display: flex; }

    .drawer {
      width: 100%;
      max-width: 520px;
      height: 100%;
      background: var(--surface);
      padding: 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-weight: 700;
    }

    .info-box {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 14px;
      padding: 14px;
      font-size: 13px;
    }

    .info-box h4 {
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
    }

    .info-box ul {
      margin: 0;
      padding-left: 18px;
    }

    .review-form {
      display: grid;
      gap: 8px;
    }

    .review-form input, .review-form select {
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
    }

    .review-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 12px;
      margin-top: 8px;
    }

    .disclaimer {
      font-size: 12px;
      color: var(--ink-soft);
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-badge">SW</span>
        <span>StepWorld</span>
      </div>

      <div class="controls">
        <div class="pill-group" role="group" aria-label="여권 선택">
          <button type="button" class="pill-btn active" data-passport="KR">KR 한국</button>
          <button type="button" class="pill-btn" data-passport="CN">CN 중국</button>
          <button type="button" class="pill-btn" data-passport="US">US 미국</button>
        </div>

        <label class="age-box" for="birthYearInput">
          <span>출생연도</span>
          <input id="birthYearInput" type="number" min="1960" max="2020" value="1998" />
          <span id="ageDisplay">(만 28세)</span>
        </label>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card hero">
      <span class="eyebrow" id="heroBadge">대한민국 여권 기준 · 8개국 가이드</span>
      <h1>비자·워홀 조건부터 안전 이슈, 낮·밤 즐길 거리와 채용까지 한눈에</h1>
      <p>여권과 출생연도를 바꾸면 워킹홀리데이 연령 적합 여부와 비자 안내가 즉시 갱신됩니다.</p>

      <div class="filter-row">
        <input id="searchInput" class="search-input" type="search" placeholder="국가 또는 도시 검색 (예: 호주, 일본, 방콕, 런던)" />
        <button type="button" class="tab-btn active" data-filter="all">전체 8개국</button>
        <button type="button" class="tab-btn" data-filter="whv">워홀·청년비자 가능</button>
        <button type="button" class="tab-btn" data-filter="free">무비자 단기체류</button>
      </div>
    </section>

    <section>
      <div class="section-head">
        <h2 class="section-title" id="countryCountTitle">국가별 비자 · 체류 요약</h2>
      </div>
      <div id="countryGrid" class="grid"></div>
    </section>

    <section class="card">
      <div class="section-head">
        <h2 class="section-title">추천 해외 채용 공고</h2>
        <select id="jobCountrySelect" aria-label="채용 국가 필터" style="height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:13px;">
          <option value="all">전체 국가</option>
        </select>
      </div>
      <div id="jobsList" class="jobs-list"></div>
    </section>

    <footer class="disclaimer">
      안내: 비자 수수료, 쿼터, 무비자 체류 기간 및 현지 안전·주류 규정은 국가 정책에 따라 수시로 변동될 수 있으므로 출국·신청 전 공식 기관 공지를 반드시 확인하세요.
    </footer>
  </main>

  <aside id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true">
    <div id="drawerPanel" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawer-head">
        <div>
          <h3 id="drawerTitle" style="margin:0;font-size:19px;font-weight:800;"></h3>
          <div id="drawerSub" style="font-size:12px;color:var(--ink-soft);"></div>
        </div>
        <button type="button" id="closeDrawerBtn" class="close-btn" aria-label="닫기">✕</button>
      </div>
      <div id="drawerBody" style="display:grid;gap:14px;"></div>
    </div>
  </aside>

    function getAge() {

    function evaluateWhv(rule, age) {
      if (!rule.whv) {
        return { eligible: false, label: '협정 미체결', note: '취업/학업 등 대안 경로 확인' };
      }
      if (age !== null && age > rule.maxAge) {
        return { eligible: false, label: `만 ${rule.maxAge}세 초과`, note: '일반 취업비자 경로 권장' };
      }
      if (age !== null && age < rule.minAge) {
        return { eligible: false, label: `만 ${rule.minAge}세 미만`, note: '신청 연령 기준 미도달' };
      }
      return {
        eligible: true,
        label: `신청 가능 (${rule.minAge}-${rule.maxAge}세)`,
        note: age === rule.maxAge ? '상한 연령 해당 · 일정 확인 권장' : '연령 기준 충족'
      };

    function renderCountries() {
      const age = getAge();
      const q = state.query.trim().toLowerCase();
      const grid = $('#countryGrid');
      grid.innerHTML = '';

      const matches = COUNTRIES.filter((c) => {
        const rule = c.rules[state.passport];
        const whv = evaluateWhv(rule, age);
        const textMatch = !q || c.name.toLowerCase().includes(q) || c.cities.toLowerCase().includes(q) || c.code.toLowerCase().includes(q);

        if (state.filter === 'whv') return whv.eligible;
        if (state.filter === 'free') return rule.freeEntry;
        return true;

      $('#countryCountTitle').textContent = `국가별 비자 · 체류 요약 (${matches.length}개국)`;

        card.className = 'country-card';

        const top = document.createElement('div');

        const left = document.createElement('div');

        const sub = document.createElement('div');
        sub.className = 'country-sub';
        sub.textContent = c.cities;
        nameWrap.append(h3, sub);
        left.append(codeEl, nameWrap);

        const badge = document.createElement('span');
        badge.className = `badge ${whv.eligible ? 'badge-ok' : 'badge-neutral'}`;
        badge.textContent = whv.label;

        top.append(left, badge);

        const meta = document.createElement('div');
        meta.className = 'meta-list';

          ['워홀·청년비자', rule.visaName],
          ['취업 비자', rule.workVisa],

          const l = document.createElement('span');
          l.className = 'meta-label';
          l.textContent = label;
          const v = document.createElement('span');
          v.className = 'meta-val';

        btn.textContent = '절차 · 안전 · 낮/밤 가이드 보기';

        card.append(top, meta, btn);
        grid.appendChild(card);

      submitBtn.type = 'submit';
      submitBtn.className = 'btn-primary';
      submitBtn.textContent = '메모 추가';

      form.append(catSelect, textInput, submitBtn);
      reviewBox.appendChild(form);

      const listWrap = document.createElement('div');
      const renderDrawerReviews = () => {
        listWrap.innerHTML = '';
        const items = state.reviewsByCountry[c.id] || [];
        items.forEach((item) => {
          const rc = document.createElement('div');
          rc.className = 'review-card';
          const tag = document.createElement('strong');
          tag.textContent = `[${item.category}] `;
          const span = document.createElement('span');
          span.textContent = item.text;
          rc.append(tag, span);
          listWrap.appendChild(rc);
        });
      };
      renderDrawerReviews();

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const val = textInput.value.trim();
        if (!val) return;
        if (!state.reviewsByCountry[c.id]) state.reviewsByCountry[c.id] = [];
        state.reviewsByCountry[c.id].unshift({ category: catSelect.value, text: val });
        textInput.value = '';
        renderDrawerReviews();
      });

      reviewBox.appendChild(listWrap);
      body.append(stepsBox, safetyBox, playBox, reviewBox);

      const backdrop = $('#drawerBackdrop');
      backdrop.classList.add('open');
      backdrop.setAttribute('aria-hidden', 'false');
    }

    function closeDrawer() {
      const backdrop = $('#drawerBackdrop');
      backdrop.classList.remove('open');
      backdrop.setAttribute('aria-hidden', 'true');
      state.selectedCountryId = null;
    }

    document.querySelectorAll('[data-passport]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.passport = btn.dataset.passport;
        renderHeader();
        renderCountries();
        if (state.selectedCountryId) openDrawer(state.selectedCountryId);
      });
    });

    document.querySelectorAll('[data-filter]').forEach((btn) => {
      btn.addEventListener('click', () => {
        state.filter = btn.dataset.filter;
        renderHeader();
        renderCountries();
      });
    });

    $('#birthYearInput').addEventListener('input', (e) => {
      state.birthYear = e.target.value;
      renderHeader();
      renderCountries();
    });

    $('#searchInput').addEventListener('input', (e) => {
      state.query = e.target.value;
      renderCountries();
    });

    $('#jobCountrySelect').addEventListener('change', (e) => {
      state.jobCountry = e.target.value;
      renderJobs();
    });

    $('#closeDrawerBtn').addEventListener('click', closeDrawer);
    $('#drawerBackdrop').addEventListener('click', (e) => {
      if (e.target === $('#drawerBackdrop')) closeDrawer();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });

    renderHeader();
    renderCountries();
    renderJobOptions();
    renderJobs();
  </script>
</body>
</html>
